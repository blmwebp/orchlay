
<!doctype html>
<html lang="en">
  <head>
    <!-- Basic metadata -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta name="theme-color" content="#17365D" />

    <!-- SEO -->
    <title>
      Orchlay Solutions | IT Consulting & Technology Services
    </title>

    <meta
      name="description"
      content="Orchlay Solutions delivers professional IT consulting, Microsoft technology services, Acterys solutions, managed IT, infrastructure and cloud services."
    />
    <meta
      property="og:image"
      content="/assets/favicon.png"
    />

    <!-- Favicon: add these files to /public -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/favicon.png"
    />
    <link
      rel="apple-touch-icon"
      href="/assets/logo_color.png"
    />

    <!-- Google Fonts: use only fonts used in CSS -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph: social sharing -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Orchlay Solutions | Technology. Expertise. Transformation."
    />
    <meta
      property="og:description"
      content="Professional technology services, Acterys solutions, managed IT, infrastructure and cloud services."
    />
    <meta property="og:site_name" content="Orchlay Solutions" />

    <!-- Social card settings -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Orchlay Solutions | Technology Services"
    />
    <meta
      name="twitter:description"
      content="Explore professional IT consulting, Acterys, managed IT, infrastructure and cloud services."
    />

    <!-- Additional SEO -->
    <meta name="robots" content="index, follow" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
